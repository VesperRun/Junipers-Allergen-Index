name: Deploy GitHub Pages

# Publishes static files to the gh-pages branch. One-time repo setup:
# Settings → Pages → Build and deployment → Deploy from a branch → gh-pages / (root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage static site
        run: |
          mkdir -p public
          cp index.html public/
          cp -r css js data public/
          cp .nojekyll public/ 2>/dev/null || touch public/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
